<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Matematik Tahap 2</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .card { background: #1e293b; max-width: 450px; margin: auto; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #38bdf8; position: relative; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 10px; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; background: #334155; padding: 10px 15px; border-radius: 8px; }
        .question { font-size: 36px; font-weight: bold; margin: 20px 0; color: #facc15; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: #0284c7; color: white; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); background: #0369a1; }
        .start-btn { width: 100%; background: #22c55e; font-size: 18px; margin-top: 10px; }
        .admin-btn { background: #475569; font-size: 12px; padding: 6px 12px; border-radius: 6px; margin-top: 15px; }
        .hidden { display: none; }
        
        /* Form & Input Style */
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; border-radius: 8px; border: 1px solid #38bdf8; background: #0f172a; color: #fff; font-size: 16px; }
        label { font-weight: bold; font-size: 14px; text-align: left; display: block; color: #cbd5e1; }

        /* Admin Dashboard & Table */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; color: #fff; font-size: 14px; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
        th { background-color: #0284c7; color: white; }
        tr:nth-child(even) { background-color: #1e293b; }
        tr:nth-child(odd) { background-color: #0f172a; }
        .top-scorer { background-color: #15803d !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 Misi Matematik Tahap 2</h1>
    <p style="font-size: 14px; color: #94a3b8;">Operasi + & - (Lingkungan 100)</p>

    <!-- BORANG PENDAFTARAN MURID -->
    <div id="register-screen">
        <label for="studentName">Nama Penuh Murid:</label>
        <input type="text" id="studentName" placeholder="Contoh: Muhammad Ali" required>

        <label for="studentClass">Tahun / Kelas:</label>
        <select id="studentClass">
            <option value="Tahun 4">Tahun 4</option>
            <option value="Tahun 5">Tahun 5</option>
            <option value="Tahun 6">Tahun 6</option>
        </select>

        <p style="font-size: 13px; color: #f1f5f9;">
            ⚡ <b>2 Markah</b> setiap jawapan betul<br>
            ⏱️ Masa menjawab: <b>60 Saat</b>
        </p>

        <button class="start-btn" onclick="validateAndStart()">MULA MISI</button>
        <button class="admin-btn" onclick="showAdminScreen()">🔒 Panel Admin / Guru</button>
    </div>

    <!-- SKRIN PERMAINAN -->
    <div id="game-screen" class="hidden">
        <div class="stats">
            <span>⏱️ Masa: <span id="timer">60</span>s</span>
            <span>⭐ Markah: <span id="score">0</span></span>
        </div>
        <div class="question" id="question">0 + 0</div>
        <div class="btn-grid" id="options"></div>
    </div>

    <!-- SKRIN KEPUTUSAN -->
    <div id="end-screen" class="hidden">
        <h2>MISI SELESAI! 🎉</h2>
        <p>Tahniah <b id="displayPlayerName" style="color:#38bdf8;"></b>!</p>
        <p>Jumlah Markah Anda:</p>
        <h1 id="final-score" style="font-size: 48px; color: #4ade80; margin: 10px 0;">0</h1>
        <button class="start-btn" onclick="showRegisterScreen()">Pemain Baharu / Cuba Lagi</button>
        <button class="admin-btn" onclick="showAdminScreen()">🔒 Lihat Kedudukan (Admin)</button>
    </div>

    <!-- PANEL ADMIN / DASHBOARD GURU -->
    <div id="admin-screen" class="hidden">
        <h2 style="color: #facc15; margin-bottom: 5px;">📊 Rekod Penyertaan</h2>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 0;">Disusun mengikut Markah Tertinggi</p>
        
        <div style="max-height: 250px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nama</th>
                        <th>Tahun</th>
                        <th>Markah</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Data pemain akan dimasukkan di sini -->
                </tbody>
            </table>
        </div>

        <button class="start-btn" style="background:#0284c7; margin-top:15px;" onclick="showRegisterScreen()">Kembali ke Permainan</button>
        <button class="admin-btn" style="background:#ef4444;" onclick="clearData()">Padam Semua Data</button>
    </div>
</div>

<script>
    let score = 0, timeLeft = 60, timerInterval, currentAnswer = 0;
    let currentPlayer = { name: "", classYear: "" };

    function validateAndStart() {
        const nameInput = document.getElementById('studentName').value.trim();
        const classInput = document.getElementById('studentClass').value;

        if (nameInput === "") {
            alert("Sila masukkan nama anda terlebih dahulu!");
            return;
        }

        currentPlayer.name = nameInput;
        currentPlayer.classYear = classInput;

        startGame();
    }

    function startGame() {
        score = 0; 
        timeLeft = 60;
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        
        document.getElementById('register-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        generateQuestion();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
            }
        }, 1000);
    }

    function generateQuestion() {
        let isAdd = Math.random() > 0.5;
        let num1 = Math.floor(Math.random() * 50) + 10;
        let num2 = Math.floor(Math.random() * 40) + 5;
        
        if (isAdd) {
            currentAnswer = num1 + num2;
            document.getElementById('question').innerText = `${num1} + ${num2}`;
        } else {
            if (num1 < num2) [num1, num2] = [num2, num1];
            currentAnswer = num1 - num2;
            document.getElementById('question').innerText = `${num1} - ${num2}`;
        }

        let options = [currentAnswer];
        while (options.length < 4) {
            let wrong = currentAnswer + (Math.floor(Math.random() * 12) - 6);
            if (wrong >= 0 && !options.includes(wrong) && wrong !== currentAnswer) {
                options.push(wrong);
            }
        }
        options.sort(() => Math.random() - 0.5);

        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (selected === currentAnswer) {
            score += 2;
            document.getElementById('score').innerText = score;
        }
        generateQuestion();
    }

    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        document.getElementById('displayPlayerName').innerText = currentPlayer.name;

        // Simpan rekod ke LocalStorage
        saveScore(currentPlayer.name, currentPlayer.classYear, score);
    }

    function saveScore(name, classYear, score) {
        let records = JSON.parse(localStorage.getItem('mathGameRecords')) || [];
        records.push({ name: name, classYear: classYear, score: score, time: new Date().toLocaleTimeString() });
        localStorage.setItem('mathGameRecords', JSON.stringify(records));
    }

    function showAdminScreen() {
        document.getElementById('register-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');

        let records = JSON.parse(localStorage.getItem('mathGameRecords')) || [];
        // Susun mengikut markah tertinggi
        records.sort((a, b) => b.score - a.score);

        let tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">Tiada rekod penyertaan lagi.</td></tr>';
            return;
        }

        records.forEach((rec, index) => {
            let tr = document.createElement('tr');
            if (index === 0) tr.classList.add('top-scorer'); // Highlight Tempat Pertama
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${rec.name}</td>
                <td>${rec.classYear}</td>
                <td><b>${rec.score}</b></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showRegisterScreen() {
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('register-screen').classList.remove('hidden');
        document.getElementById('studentName').value = '';
    }

    function clearData() {
        if (confirm("Adakah anda pasti untuk memadam semua data penyertaan murid?")) {
            localStorage.removeItem('mathGameRecords');
            showAdminScreen();
        }
    }
</script>
</body>
</html>
