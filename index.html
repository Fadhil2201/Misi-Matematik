<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misi Matematik Tahap 2</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e293b; max-width: 400px; margin: auto; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #38bdf8; }
        h1 { color: #38bdf8; font-size: 22px; margin-bottom: 10px; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; background: #334155; padding: 10px; border-radius: 8px; }
        .question { font-size: 32px; font-weight: bold; margin: 20px 0; color: #facc15; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: #0284c7; color: white; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); background: #0369a1; }
        .start-btn { width: 100%; background: #22c55e; font-size: 18px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 Misi Matematik Tahap 2</h1>
    <p>Operasi + & - (Lingkungan 100)</p>

    <div id="start-screen">
        <p>⚡ 2 Markah setiap jawapan betul<br>⏱️ Masa: 60 Saat</p>
        <button class="start-btn" onclick="startGame()">MULA MISI</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="stats">
            <span>⏱️ Masa: <span id="timer">60</span>s</span>
            <span>⭐ Markah: <span id="score">0</span></span>
        </div>
        <div class="question" id="question">0 + 0</div>
        <div class="btn-grid" id="options"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h2>MISI SELESAI! 🎉</h2>
        <p>Jumlah Markah Anda:</p>
        <h1 id="final-score" style="font-size: 48px; color: #4ade80;">0</h1>
        <button class="start-btn" onclick="startGame()">MAIN LAGI</button>
    </div>
</div>

<script>
    let score = 0, timeLeft = 60, timerInterval, currentAnswer = 0;

    function startGame() {
        score = 0; timeLeft = 60;
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        generateQuestion();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
            }
        }, 1000);
    }

    function generateQuestion() {
        let isAdd = Math.random() > 0.5;
        let num1 = Math.floor(Math.random() * 50) + 10;
        let num2 = Math.floor(Math.random() * 40) + 5;
        
        if (isAdd) {
            currentAnswer = num1 + num2;
            document.getElementById('question').innerText = `${num1} + ${num2}`;
        } else {
            if (num1 < num2) [num1, num2] = [num2, num1];
            currentAnswer = num1 - num2;
            document.getElementById('question').innerText = `${num1} - ${num2}`;
        }

        let options = [currentAnswer];
        while (options.length < 4) {
            let wrong = currentAnswer + (Math.floor(Math.random() * 10) - 5);
            if (wrong >= 0 && !options.includes(wrong)) options.push(wrong);
        }
        options.sort(() => Math.random() - 0.5);

        let optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (selected === currentAnswer) {
            score += 2;
            document.getElementById('score').innerText = score;
        }
        generateQuestion();
    }

    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
    }
</script>
</body>
</html>
